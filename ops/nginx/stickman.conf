# Shuttle Sticks at stickman.urbancare.ge: static files from ~/stickman-site/current
# (published there by ops/deploy.sh). certbot adds the TLS server block and the
# http -> https redirect.
#
#   sudo cp ~/stickman/ops/nginx/stickman.conf /etc/nginx/sites-available/stickman
#   sudo ln -s /etc/nginx/sites-available/stickman /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx --no-directory-hooks -d stickman.urbancare.ge
server {
    listen 80;
    listen [::]:80;
    server_name stickman.urbancare.ge;

    root /home/urbancare/stickman-site/current;
    index index.html;

    # The game only reads; nothing is uploaded.
    client_max_body_size 1k;

    # The JS files have fixed names, so browsers must revalidate (ETag) on each
    # load or a deploy would not reach returning players.
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;

    gzip_types text/css application/javascript text/javascript application/json image/svg+xml;

    location / {
        try_files $uri $uri/ =404;
    }

    # Online 1v1: the room server (server/server.js, run by ops/systemd/stickman-rooms.service).
    location = /ws {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # Never serve dotfiles, should one ever reach a release.
    location ~ /\. {
        deny all;
    }
}
